# --- VPS Connection ---
vps_ip: "YOUR_VPS_IP"

# --- MPTCP Configuration ---
# Maximum number of MPTCP subflows (one per gateway connection from router)
mptcp_max_subflows: 8
# Maximum additional addresses accepted from clients
mptcp_max_add_addr_accepted: 8

# --- Shadowsocks Configuration ---
# Port for shadowsocks-libev MPTCP proxy (TCP traffic aggregation)
shadowsocks_port: 65101
# Encryption method (chacha20-ietf-poly1305 recommended for security + performance)
shadowsocks_method: "chacha20-ietf-poly1305"
# Password for shadowsocks authentication (CHANGE THIS)
shadowsocks_password: "CHANGE_ME_to_a_strong_password"
# Timeout in seconds for idle connections (600 matches OpenMPTCProuter default)
shadowsocks_timeout: 600

# --- Glorytun Configuration ---
# Enable glorytun for UDP/ICMP traffic tunneling
glorytun_enabled: true
# Port for glorytun tunnel
glorytun_port: 65001
# Glorytun key is auto-generated on the VPS during deployment.
# After deployment, retrieve it with: cat /opt/tollgate/mptcp/server-config.txt
# Tunnel network - IPs match OpenMPTCProuter client defaults so routers
# connect without needing to change their glorytun localip/remoteip settings
glorytun_server_ip: "10.255.255.1"
glorytun_client_ip: "10.255.255.2"
glorytun_netmask: "255.255.255.252"

# --- Firewall (UFW) ---
# Set to true to enable UFW and manage firewall rules.
# WARNING: If false (default), firewall is left untouched — you manage it yourself.
# If true, UFW will be enabled with default-deny incoming and only the ports
# listed below will be allowed. Make sure to add ALL ports your VPS needs
# (e.g., 80, 443 for Traefik, Cashu mint ports, etc.) to firewall_extra_ports.
firewall_manage: false
# Additional ports to allow through the firewall (only used if firewall_manage=true)
# Example: ["80", "443", "3338"]
firewall_extra_ports: []

# --- SSH Hardening ---
# Set to true to apply SSH hardening (disable password auth, restrict root login).
# WARNING: If true, password-based SSH will be disabled. Make sure you have
# key-based SSH access configured BEFORE enabling this.
ssh_hardening_enabled: false
ssh_port: 22
ssh_permit_root_login: "prohibit-password"
ssh_password_auth: "no"

# --- NAT / Forwarding ---
# Network interface for outbound traffic (auto-detected if empty)
nat_interface: ""

# --- Data Directory ---
mptcp_data_dir: "/opt/tollgate/mptcp"

# --- TollGate Meter (roles/meter, WP1) ---
#
# The metering ceiling for a paid bonding service. WP1 installs the SHAPE only: our own
# nftables table, default-deny, with the never-block-payment allow-list and the empty
# per-client object area. No budget is installed and nothing is billed by this role.
#
# Every value here is a variable on purpose. The failure this guards against is silent: a
# metered chain in `policy accept` delivers over-quota traffic and looks healthy (measured:
# 81/100 over-quota packets passed), and a rule keyed on an egress interface meters the
# server's INTERNET side so the customer pays for the server's own retransmissions.
meter_enabled: true

# Own table only. NEVER flush or replace the host's ruleset: this box may host other services,
# and /etc/nftables.conf is shared. Address our table by name and leave everything else alone.
meter_table: "tgmeter"
meter_family: "ip"          # 'ip' keys a v4 client address directly; 'inet' needs a nfproto guard per rule
meter_uplink_chain: "uplink"
meter_downlink_chain: "downlink"

# Must be 'drop'. Asserted in roles/meter/tasks/main.yml — a metered chain that is not
# default-deny is a free tunnel, so this is not offered as a choice.
meter_default_verdict: "accept"

# The proxied data path (the metered leg) and the payment surface (never gated).
meter_dns_port: 53
meter_proxy_port: 65101
meter_payment_port: 2121

# The client population, used for the never-block allow-list. Tighten to the real client
# range before enabling enforcement.
meter_client_cidr: "0.0.0.0/0"

# Object name prefixes. One named counter per direction plus one named quota per client
# (WP4). Dynamic maps are NOT used: `update @map { ip saddr }` returns EOPNOTSUPP on stock
# nftables, so every client's objects must be pre-provisioned — and if that silently no-ops,
# the meter bills nobody and reports nothing.
meter_counter_prefix: "c"
meter_quota_prefix: "q"

# Per-client objects, provisioned by the control plane (WP4). Empty in WP1, which is why the
# ceiling is default-deny: an unprovisioned client is quarantined loudly rather than served free.
meter_client_objects: []

# Where the rendered table, the usage journal and the client list live. Declared and
# configurable, never an incidental path.
meter_state_dir: "{{ mptcp_data_dir }}/meter"

# Resolvers that stay reachable while a client is gated (DNS breaks first, least visibly).
meter_resolvers: ["9.9.9.9", "149.112.112.112"]

# Policy inputs, NOT kernel constants.
meter_tick_seconds: 1
meter_bytes_per_sat: 1048576
meter_grace_bytes: 262144

# Expected accept-rule counts per chain, for the duplicate guard. Derived from the shape:
# 2 resolver rules (udp+tcp on port 53, present only when meter_resolvers is non-empty)
# + 2 payment rules (tcp+udp on meter_payment_port, always present).
# The guard exists because `nft -f` APPENDS to an existing table, so a repeated apply multiplies
# every rule while the playbook reports changed=0 and presence-based guards still pass.
meter_expected_uplink_accepts: 6
meter_expected_downlink_accepts: 6

# Co-located service ports that MUST survive this role. This is the shared-host safety guard.
#
# The FIRST version of this role set `policy drop` on an `input`-hooked chain. That silently killed
# the host's `ss-server` on :65101 (live since Oct 3) and SSH on :2222, even though the pre-existing
# ufw ruleset explicitly accepts both — a drop-policy chain at the same hook drops everything it is
# not told to accept. Measured, then fixed by moving the drop INSIDE the metered rule and leaving
# the chain policy at `accept`.
#
# Every port listed here is probed after the apply, from the node. A dead port fails the play.
# Set to [] on a dedicated box where hijacking cannot matter.
meter_protected_ports: [2222, 65101, 2121]
meter_probe_host: "127.0.0.1"
meter_probe_timeout: 3
